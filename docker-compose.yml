services:
  api:
    image: digfinder-api
    build: .
    ports:
      - "3333:3333"
    env_file:
      - .env
    environment:
      PORT: "3333"
      DATABASE_URL: file:/data/dev.db
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - sqlite-data:/data
    restart: unless-stopped

volumes:
  sqlite-data:
